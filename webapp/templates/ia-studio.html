<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Outil d'IA – Configurez et choisissez votre modèle Google AI Studio.">
  <title>IA Studio — Choix du modèle</title>
  <link rel="icon" type="image/png" href="../static/fautexprimer.png">
  <link rel="stylesheet" href="../static/css/styles.css">
  <script defer src="../static/js/app.js"></script>
</head>
<body>
  <main class="wrap" id="ia-studio">
    <header class="header">
      <a class="brand" href="#/" aria-label="Retour">
        <img src="../static/fautexprimer.png" alt="Fautexprimer" width="52" height="52">
        <span>Fautexprimer <span class="sticker">3 moteurs</span></span>
      </a>
      <h1 class="vitrine-header">IA Studio — Choix du modèle</h1>
      <p class="sub">Configurez la zone de saisie et sélectionnez le modèle Google AI Studio.</p>
    </header>

    <section class="section">
      <div class="form-grid">
        <div class="form-field">
          <label for="repo-url">URL du dépôt GitHub</label>
          <input type="url" id="repo-url" placeholder="https://github.com/utilisateur/depot">
          <span class="hint">Exemple : github.com/Kraftdanilo/gemini-live-tts</span>
        </div>

        <div class="form-field">
          <label for="model-select">Modèle Google AI Studio</label>
          <select id="model-select">
            <option value="gemini-1.5-flash">Gemini 1.5 Flash (rapide, gratuit)</option>
            <option value="gemini-1.5-pro">Gemini 1.5 Pro (plus aptes)</option>
            <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash Experimental (expérimental)</option>
          </select>
        </div>

        <div class="form-field">
          <label for="prompt">Instructions (optionnel)</label>
          <textarea id="prompt" rows="4" placeholder="Décrivez ce que vous voulez que l'IA fasse…"></textarea>
        </div>

        <div class="form-actions">
          <button class="primary" id="submit-btn">Lancer l'IA Studio</button>
          <span id="status" class="status" hidden></span>
        </div>
      </div>

      <div id="output" class="output" hidden></div>
    </section>

    <footer class="foot">
      Outil local — Aucune donnée envoyée sans votre accord.
    </footer>
  </main>

  <script>
    (() => {
      'use strict'
      const $ = id => document.getElementById(id)
      const repoUrl = $('repo-url')
      const modelSelect = $('model-select')
      const prompt = $('prompt')
      const submitBtn = $('submit-btn')
      const status = $('status')
      const output = $('output')

      const MODELS = {
        'gemini-1.5-flash': { label: 'Gemini 1.5 Flash', baseUrl: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent', free: true },
        'gemini-1.5-pro': { label: 'Gemini 1.5 Pro', baseUrl: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent', free: false },
        'gemini-2.0-flash-exp': { label: 'Gemini 2.0 Flash Exp', baseUrl: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent', free: true }
      }

      async function callAIStudio(apiKey, prompt, model = 'gemini-1.5-flash') {
        if (!apiKey) throw new Error('API key manquante')
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.2 }
          })
        })
        if (!response.ok) {
          const err = await response.json().catch(() => ({}))
          throw new Error(err.error?.message || `HTTP ${response.status}`)
        }
        const data = await response.json()
        return data.candidates?.[0]?.content?.parts?.[0]?.text || 'Aucune réponse.'
      }

      async function handleSubmit(e) {
        e.preventDefault()
        const url = repoUrl.value.trim()
        const model = modelSelect.value
        const promptText = prompt.value.trim()

        if (!url) { status.textContent = 'Veuillez entrer l\'URL du dépôt.'; status.hidden = false; return }
        if (!MODELS[model]) { status.textContent = 'Modèle invalide.'; status.hidden = false; return }

        submitBtn.disabled = true
        submitBtn.textContent = 'Analyse en cours…'
        status.hidden = false
        output.hidden = true

        try {
          const apiKey = prompt('Veuillez saisir votre clé API Google AI Studio :').trim()
          if (!apiKey) throw new Error('Clé API requise')

          const ctx = `Tu es un assistant technique. Le dépôt GitHub ${url} donne un blocage de push sur GitHub avec l'erreur GH013 (secret-scanning). Le commit ${'afbe96a'} contient une clé API dans .env.example.
          \n\nObjectif : faire un force push sans exposer les clés.
          \n\nAnalyse les risques, propose une procédure pas à pas, et confirme que le force push sera sûr.`
          const result = await callAIStudio(apiKey, ctx, model)
          output.hidden = false
          output.innerHTML = `<pre>${result}</pre>`
        } catch (err) {
          status.textContent = `Erreur : ${err.message}`
          output.hidden = false
          output.innerHTML = `<p class="err">${err.message}</p>`
        } finally {
          submitBtn.disabled = false
          submitBtn.textContent = 'Lancer l\'IA Studio'
        }
      }

      submitBtn.addEventListener('click', handleSubmit)
      repoUrl.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(e) })
    })()
  </script>
</body>
</html>
